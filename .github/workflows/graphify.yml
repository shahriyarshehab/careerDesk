name: Graphify Codebase Map

on:
  push:
    branches: [main]
    paths:
      - "assets/js/**"
      - "scripts/build_graphify.py"
      - ".github/workflows/graphify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphify:
    name: Build codebase knowledge graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Graphify
        run: python -m pip install --upgrade pip graphifyy

      - name: Analyze CareerDesk source code
        run: python scripts/build_graphify.py

      - name: Upload Graphify outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careerdesk-architecture-map
          path: docs/architecture/
          if-no-files-found: warn
          retention-days: 14
